[project]
name = "agent-flow-engine"
version = "0.1.0"
description = "Pure Python engine that runs agent-flow-builder workflow graphs."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes: unused imports, undefined names
    "I",   # isort: import order
    "N",   # pep8-naming
    "UP",  # pyupgrade: use modern syntax for the target Python
    "B",   # flake8-bugbear: likely bugs, e.g. mutable default arguments
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "PT",  # flake8-pytest-style
    "RUF", # ruff-specific rules
]

[tool.mypy]
strict = true
# Listed here so a bare `uv run mypy` checks the package and its tests.
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib mode lets tests import the installed package without tests/__init__.py files.
addopts = ["--import-mode=importlib", "--strict-markers", "--strict-config", "-ra"]
xfail_strict = true
