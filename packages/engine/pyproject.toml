[project]
name = "agent-flow-engine"
version = "0.1.0"
description = "Pure Python engine that runs agent-flow-builder workflow graphs."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint]
extend-select = [
    "TID", # flake8-tidy-imports: enforces the banned imports below
]

# The engine must stay free of HTTP and database code (see README.md and ADR-0001).
# Banning a module also bans its submodules and `from ... import` forms.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"fastapi".msg = "The engine never imports HTTP code. See packages/engine/README.md."
"starlette".msg = "The engine never imports HTTP code. See packages/engine/README.md."
"httpx".msg = "The engine never imports HTTP code. See packages/engine/README.md."
"requests".msg = "The engine never imports HTTP code. See packages/engine/README.md."
"aiohttp".msg = "The engine never imports HTTP code. See packages/engine/README.md."
"sqlalchemy".msg = "The engine never imports database code. See packages/engine/README.md."
"asyncpg".msg = "The engine never imports database code. See packages/engine/README.md."
"psycopg".msg = "The engine never imports database code. See packages/engine/README.md."

[tool.mypy]
strict = true
# tests/ has no __init__.py files, so without these mypy names each test module by its
# file name alone and fails on two test files that share a name in different folders.
# mypy_path makes the package resolve as `agent_flow_engine`, not `src.agent_flow_engine`.
explicit_package_bases = true
mypy_path = "src"
# Listed here so a bare `uv run mypy` checks the package and its tests.
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib mode lets tests import the installed package without tests/__init__.py files.
addopts = ["--import-mode=importlib", "--strict-markers", "--strict-config", "-ra"]
xfail_strict = true
