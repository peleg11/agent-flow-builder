version: 2

updates:
  # `uv`, not `pip`: CI runs `uv sync --locked`, so updates must rewrite uv.lock too.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly

  # The `npm` ecosystem also handles pnpm lockfiles.
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
